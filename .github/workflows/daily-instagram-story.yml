name: Three Daily Instagram Stories

on:
  schedule:
    # Three idempotent chances per slot: primary, +10m backup, +25m watchdog.
    # A persistent GitHub cache marker plus the API record prevents duplicate
    # Instagram stories even when Render restarts and loses its local record.
    - cron: "55 19 * * *"  # 04:55 JST -> morning primary at 05:00
    - cron: "10 20 * * *"  # 05:10 JST -> morning backup
    - cron: "25 20 * * *"  # 05:25 JST -> morning watchdog
    - cron: "55 1 * * *"   # 10:55 JST -> column primary at 11:00
    - cron: "10 2 * * *"   # 11:10 JST -> column backup
    - cron: "25 2 * * *"   # 11:25 JST -> column watchdog
    - cron: "55 7 * * *"   # 16:55 JST -> tarot primary at 17:00
    - cron: "10 8 * * *"   # 17:10 JST -> tarot backup
    - cron: "25 8 * * *"   # 17:25 JST -> tarot watchdog
  workflow_dispatch:
    inputs:
      slot:
        description: Story slot
        required: true
        default: morning
        type: choice
        options:
          - morning
          - column
          - evening
      target_date:
        description: Optional YYYY-MM-DD in JST
        required: false
        type: string
      force_repost:
        description: Repost even when the date/slot is already recorded
        required: false
        default: false
        type: boolean
      mark_published_only:
        description: Record the date/slot as published without calling Instagram
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-instagram-story
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve slot and target date
        id: resolve
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "${SCHEDULE}" in
            "55 19 * * *"|"10 20 * * *"|"25 20 * * *"|"41 19 * * *") SLOT="morning"; PUBLISH_AT="05:00" ;;
            "55 1 * * *"|"10 2 * * *"|"25 2 * * *"|"41 1 * * *") SLOT="night"; PUBLISH_AT="11:00" ;;
            "55 7 * * *"|"10 8 * * *"|"25 8 * * *"|"41 7 * * *") SLOT="evening"; PUBLISH_AT="17:00" ;;
            *) SLOT="${MANUAL_SLOT:-morning}" ;;
          esac
          if [ "${SLOT}" = "column" ]; then SLOT="night"; fi
          TODAY_JST="$(TZ=Asia/Tokyo date +%F)"
          TARGET_DATE="${MANUAL_TARGET_DATE:-${TODAY_JST}}"
          if [ "${EVENT_NAME}" = "schedule" ] && [ "${TODAY_JST}" \< "2026-08-15" ]; then
            echo "Automatic Instagram stories start on 2026-08-15 JST; skipping ${TODAY_JST}."
            exit 0
          fi
          if [ "${EVENT_NAME}" = "schedule" ]; then
            TARGET_EPOCH="$(TZ=Asia/Tokyo date -d "${TODAY_JST} ${PUBLISH_AT}:00" +%s)"
            NOW_EPOCH="$(date +%s)"
            WAIT_SECONDS="$((TARGET_EPOCH - NOW_EPOCH))"
            MAX_WAIT_SECONDS=600
            if [ "${WAIT_SECONDS}" -gt "${MAX_WAIT_SECONDS}" ]; then
              TARGET_DATE="$(TZ=Asia/Tokyo date -d yesterday +%F)"
              echo "Delayed ${SLOT} event; publishing ${TARGET_DATE} immediately."
            elif [ "${WAIT_SECONDS}" -gt 0 ]; then
              TARGET_DATE="${TODAY_JST}"
              echo "Waiting ${WAIT_SECONDS}s for ${PUBLISH_AT} JST."
              sleep "${WAIT_SECONDS}"
            else
              TARGET_DATE="${TODAY_JST}"
              echo "The scheduler started late; publishing immediately."
            fi
          fi
          echo "slot=${SLOT}" >> "${GITHUB_OUTPUT}"
          echo "target_date=${TARGET_DATE}" >> "${GITHUB_OUTPUT}"

      - name: Restore persistent published marker
        id: published-marker
        uses: actions/cache/restore@v6
        with:
          path: .story-published/${{ steps.resolve.outputs.target_date }}-${{ steps.resolve.outputs.slot }}.done
          key: instagram-story-${{ steps.resolve.outputs.target_date }}-${{ steps.resolve.outputs.slot }}

      - name: Generate and publish one story
        id: publish-story
        if: inputs.mark_published_only == true || github.event_name == 'workflow_dispatch' || steps.published-marker.outputs.cache-hit != 'true'
        env:
          AUTOMATION_URL: ${{ secrets.AUTOMATION_URL }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          SLOT: ${{ steps.resolve.outputs.slot }}
          TARGET_DATE: ${{ steps.resolve.outputs.target_date }}
          FORCE_REPOST: ${{ inputs.force_repost }}
          MARK_PUBLISHED_ONLY: ${{ inputs.mark_published_only }}
        run: |
          if [ "${MARK_PUBLISHED_ONLY}" != "true" ]; then
            QUERY="slot=${SLOT}&target_date=${TARGET_DATE}"
            if [ "${FORCE_REPOST}" = "true" ]; then
              QUERY="${QUERY}&force=true"
            fi
            SEPARATOR="?"
            case "${AUTOMATION_URL}" in *\?*) SEPARATOR="&" ;; esac
            curl --fail-with-body --show-error --silent --max-time 180 \
              --request POST \
              --header "Authorization: Bearer ${AUTOMATION_SECRET}" \
              "${AUTOMATION_URL}${SEPARATOR}${QUERY}"
          else
            echo "Recording ${TARGET_DATE}/${SLOT} without publishing."
          fi
          mkdir -p .story-published
          printf '%s\n' "${TARGET_DATE}/${SLOT}" > ".story-published/${TARGET_DATE}-${SLOT}.done"

      - name: Save persistent published marker
        if: steps.publish-story.outcome == 'success' && steps.published-marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .story-published/${{ steps.resolve.outputs.target_date }}-${{ steps.resolve.outputs.slot }}.done
          key: instagram-story-${{ steps.resolve.outputs.target_date }}-${{ steps.resolve.outputs.slot }}
